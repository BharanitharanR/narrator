[project]
name = "narrator"
version = "0.1.0"
description = "Timestamped, evidence-grounded video narration planning"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["pydantic>=2.7,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.5"]
gemini = ["google-genai>=1.0.0"]

[project.scripts]
narrator = "narrator.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
